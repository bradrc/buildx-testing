version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: buildx-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=BuildXStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    networks:
      - buildx-network
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "BuildXStrongPassword123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buildx-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=BuildXDb;User Id=sa;Password=BuildXStrongPassword123!;TrustServerCertificate=True
    ports:
      - "5000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - buildx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: buildx-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - buildx-network

networks:
  buildx-network:
    driver: bridge

volumes:
  mssql-data:
